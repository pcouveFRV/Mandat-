# Tests, construction avec Vite et déploiement sur GitHub Pages.
# Réglage à faire une fois dans le dépôt : Settings > Pages > Source : GitHub Actions.
name: Tests et déploiement
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Tests du moteur
        run: npm test
      - name: Vérification des types (information)
        run: npm run typecheck
        continue-on-error: true
      - name: Construction
        run: npm run build
      - name: Archive du site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 14
      - uses: actions/configure-pages@v5
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deployer:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
