# Télécharge les logos des partis depuis Wikimedia Commons (licences libres ou domaine public seulement)
# et les range dans la branche « logos ». Le choix final et l'intégration dans le jeu se font ensuite à la main.
name: Logos des partis
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/logos.yml', 'scripts/data/logos.mjs']
permissions:
  contents: write
jobs:
  telecharger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Télécharger
        run: node scripts/data/logos.mjs
      - name: Ranger dans la branche logos
        run: |
          cd scripts/data/logos-candidats
          ls -la
          git init -q -b logos
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Logos candidats téléchargés le $(date -u +%Y-%m-%d)"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" logos
