# Télécharge les données officielles (data.gouv.fr) depuis les serveurs de GitHub, qui ont un accès libre à internet,
# puis les range compressées dans la branche « donnees ». Se lance à la main (onglet Actions) ou quand ce fichier
# ou le script de téléchargement changent.
name: Données officielles
on:
  workflow_dispatch:
    inputs:
      tout:
        description: "Ajouter l'historique complet par bureau de vote (plusieurs Go)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['.github/workflows/donnees.yml', 'scripts/data/telecharger-mac.mjs']
permissions:
  contents: write
jobs:
  telecharger:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Télécharger
        run: node scripts/data/telecharger-mac.mjs ${{ inputs.tout && '--tout' || '' }}
      - name: Compresser et ranger dans la branche donnees
        run: |
          cd scripts/data/sources
          find . -type f ! -name '*.gz' ! -name '*.zip' ! -name '*.parquet' ! -name 'catalogue.json' -size +200k -exec gzip -9 {} \;
          find . -type f -size +95M -print -delete > trop-gros.txt || true
          du -ah . | sort -h | tail -40
          git init -q -b donnees
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Données officielles téléchargées le $(date -u +%Y-%m-%d)"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" donnees
